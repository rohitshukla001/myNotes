<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .card h1 {
      margin-bottom: 16px;
      font-size: 24px;
      color: #333;
    }

    .card p {
      margin-bottom: 30px;
      color: #666;
      font-size: 14px;
    }

    .download-btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .download-btn:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .download-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Download Android App</h1>
    <p>Click the button below to download the latest APK file.</p>

    <a href="notes.rohitshukla.net/app/app-debug.apk" download class="download-btn">
      Download APK
    </a>

    <div class="footer">
      Version: Debug Build
    </div>
  </div>

</body>
</html>
