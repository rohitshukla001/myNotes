<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stylish Bootstrap Form Buttons</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .btn-custom {
      padding: 7px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      font-weight: 500;
      transition: all 0.3s ease;
      width: auto;
      min-width: 180px;
      text-align: center;
    }

    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <form>
      <div class="button-group">
        <a href="https://example.com/link1" class="btn btn-primary btn-custom">Button 1</a>
        <a href="https://example.com/link2" class="btn btn-outline-secondary btn-custom">Button 2</a>
        <a href="https://example.com/link3" class="btn btn-success btn-custom">Button 3</a>
        <a href="https://example.com/link4" class="btn btn-outline-warning btn-custom">Button 4</a>
        <a href="https://example.com/link5" class="btn btn-danger btn-custom">Button 5</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5 JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
