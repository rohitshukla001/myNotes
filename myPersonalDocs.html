<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Form with Buttons</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .btn-custom {
      padding: 7px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <form>
      <div class="d-grid gap-3">
        <a href="https://example.com/link1" class="btn btn-primary btn-custom">Button 1</a>
        <a href="https://example.com/link2" class="btn btn-secondary btn-custom">Button 2</a>
        <a href="https://example.com/link3" class="btn btn-success btn-custom">Button 3</a>
        <a href="https://example.com/link4" class="btn btn-warning btn-custom">Button 4</a>
        <a href="https://example.com/link5" class="btn btn-danger btn-custom">Button 5</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5 JS CDN (Optional for this form) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
